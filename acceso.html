<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Prop a Prop Teu — Acceso</title>
  <link rel="icon" href="assets/logo_mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="admin-body">
  <main class="auth-wrap">
    <a class="auth-logo" href="./" aria-label="Prop a Prop Teu">
      <img src="assets/logo_mark.svg" alt="Prop a Prop Teu" height="56">
    </a>

    <form class="auth-card" id="login-form" autocomplete="on">
      <h1>Acceso</h1>
      <p class="auth-sub">Panel de gestión · solo equipo</p>

      <div class="cf-field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" required autocomplete="username">
      </div>
      <div class="cf-field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" required autocomplete="current-password">
      </div>

      <p class="auth-error" id="auth-error" hidden></p>

      <button class="btn" type="submit" id="login-btn">Entrar</button>
    </form>
  </main>

  <script src="js/config.js"></script>
  <script src="js/session.js"></script>
  <script>
    const form = document.getElementById("login-form");
    const errEl = document.getElementById("auth-error");
    const btn = document.getElementById("login-btn");

    // Already logged in? Go straight to the dashboard.
    if (Admin.token) location.href = "admin.html";

    function showError(msg) { errEl.textContent = msg; errEl.hidden = false; }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errEl.hidden = true;
      btn.disabled = true;
      btn.textContent = "Entrando…";
      const r = await Admin.call("login", {
        email: document.getElementById("email").value.trim(),
        password: document.getElementById("password").value
      });
      if (r.ok) {
        Admin.setSession(r.token, r.user);
        location.href = "admin.html";
        return;
      }
      showError(r.message || "No se ha podido iniciar sesión.");
      btn.disabled = false;
      btn.textContent = "Entrar";
    });
  </script>
</body>
</html>
