<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu — Tienda</title>
  <meta name="description" content="Attrezzo, eines i materials de disseny propi per a cinema, TV, teatre i esdeveniments.">
  <meta property="og:title" content="Prop a Prop Teu — Tienda">
  <meta property="og:image" content="assets/logo_mark.svg">
  <link rel="icon" href="assets/logo_mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="shop">
  <header class="site-header" id="site-header"></header>

  <main>
    <!-- FEATURED CAROUSEL BAND (grey) -->
    <section class="shop-featured bleed">
      <div class="container">
        <div class="shop-featured-inner">
          <div class="sf-copy">
            <div class="sf-eyebrow"><span class="slash">/</span><span id="sf-cat"></span></div>
            <p class="sf-desc" id="sf-desc"></p>
            <button class="btn-grey snipcart-add-item" id="sf-add" data-i18n="catalog.addToCartFull"></button>
          </div>
          <div class="sf-media">
            <div class="sf-wm" id="sf-wm">ATLAS</div>
            <img class="sf-img" id="sf-img" src="assets/img/products/atlas.png" alt="">
          </div>
        </div>
        <div class="sf-dots" id="sf-dots"></div>
      </div>
    </section>

    <!-- SORT TABS + GRID -->
    <div class="container">
      <nav class="shop-sort" id="shop-sort">
        <button data-sort="featured" class="active" data-i18n="catalog.sortRelevance"></button>
        <button data-sort="best" data-i18n="catalog.sortBest"></button>
        <button data-sort="az" data-i18n="catalog.sortAz"></button>
        <button data-sort="za" data-i18n="catalog.sortZa"></button>
      </nav>
      <div class="shop-grid" id="shop-grid"></div>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/shop.js"></script>
</body>
</html>
