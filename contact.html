<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu â€” Contacte</title>
  <link rel="icon" href="assets/logo_estandar_svg.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container page-narrow">
    <h1 class="rule-title" data-i18n="contact.title"></h1>

    <div class="content-block">
      <p><strong data-i18n="contact.emailLabel"></strong>: <a href="#" id="contact-email"></a></p>
      <p><strong data-i18n="contact.phoneLabel"></strong>: <span id="contact-phone"></span></p>
      <p><strong data-i18n="contact.addressLabel"></strong>: <span id="contact-address"></span></p>
    </div>

    <div class="content-block">
      <h2 data-i18n="contact.formTitle"></h2>
      <!-- NOTE: Formspree only processes file uploads on PAID plans. On the free
           tier this "attachment" field is silently ignored (the rest of the form
           still works). Verify current pricing at formspree.io/plans. -->
      <form class="std-form" id="contact-form" method="POST" enctype="multipart/form-data" style="margin-top:14px">
        <label><span data-i18n="form.name"></span><input type="text" name="name" required></label>
        <label><span data-i18n="form.email"></span><input type="email" name="email" required></label>
        <label><span data-i18n="form.message"></span><textarea name="message" required></textarea></label>
        <label><span data-i18n="form.attachment"></span><input type="file" name="attachment" accept=".pdf,.jpg,.jpeg,.png,.zip"></label>
        <button class="btn" type="submit" data-i18n="form.send"></button>
      </form>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await Layout.init();
      const em = document.getElementById("contact-email");
      em.textContent = SITE_CONFIG.email;
      em.href = "mailto:" + SITE_CONFIG.email;
      document.getElementById("contact-phone").textContent = SITE_CONFIG.phoneDisplay;
      document.getElementById("contact-address").textContent = SITE_CONFIG.address;
      document.getElementById("contact-form").action = SITE_CONFIG.formEndpoint;
    });
  </script>
</body>
</html>
