<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu — About</title>
  <meta name="description" content="Prop a Prop Teu: taller en Barcelona que diseña y fabrica atrezo, herramientas y materiales para cine, TV, teatro y eventos. Conoce al equipo.">
  <meta property="og:title" content="Prop a Prop Teu — About">
  <meta property="og:description" content="Taller de atrezo, herramientas y materiales para rodajes y escena, en Barcelona.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="assets/logo_mark.svg">
  <link rel="icon" href="assets/logo_mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main>
    <!-- STATEMENT: one sentence that says who we are -->
    <section class="container about-statement">
      <span class="eyebrow" data-i18n="about.eyebrow"></span>
      <h1 data-i18n="about.statement"></h1>
    </section>

    <!-- STORY: title on the left, text on the right -->
    <section class="container about-split">
      <h2 data-i18n="about.storyTitle"></h2>
      <div>
        <p data-i18n="about.story1"></p>
        <p data-i18n="about.story2"></p>
      </div>
    </section>

    <!-- WORKSHOP PHOTO (drop the real file at assets/img/about/workshop.jpg) -->
    <section class="container">
      <figure class="about-photo">
        <img src="assets/img/about/workshop.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src='assets/img/placeholder-landscape.svg'">
      </figure>
    </section>

    <!-- HOW WE WORK: three short points -->
    <section class="container">
      <h2 class="rule-title" data-i18n="about.howTitle"></h2>
      <div class="qualities about-how">
        <div class="quality"><span class="quality-mark quality-mark-1">01</span><h3 data-i18n="about.how1t"></h3><p data-i18n="about.how1"></p></div>
        <div class="quality"><span class="quality-mark quality-mark-2">02</span><h3 data-i18n="about.how2t"></h3><p data-i18n="about.how2"></p></div>
        <div class="quality"><span class="quality-mark quality-mark-3">03</span><h3 data-i18n="about.how3t"></h3><p data-i18n="about.how3"></p></div>
      </div>
    </section>

    <!-- TEAM: photo, name, title, what they do, short bio.
         Photos: assets/img/team/yerai.jpg and assets/img/team/albert.jpg (portrait 4:5).
         Texts: team.* in lang/*.json -->
    <section class="container">
      <h2 class="rule-title" data-i18n="team.title"></h2>
      <div class="team-duo">
        <article class="person">
          <img src="assets/img/team/yerai.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src='assets/img/placeholder-portrait.svg'">
          <div>
            <h3 data-i18n="team.member1name"></h3>
            <span class="person-role" data-i18n="team.member1role"></span>
            <p class="person-what" data-i18n="team.member1what"></p>
            <p class="person-bio" data-i18n="team.member1bio"></p>
          </div>
        </article>
        <article class="person">
          <img src="assets/img/team/albert.jpg" alt="" loading="lazy" onerror="this.onerror=null;this.src='assets/img/placeholder-portrait.svg'">
          <div>
            <h3 data-i18n="team.member2name"></h3>
            <span class="person-role" data-i18n="team.member2role"></span>
            <p class="person-what" data-i18n="team.member2what"></p>
            <p class="person-bio" data-i18n="team.member2bio"></p>
          </div>
        </article>
      </div>
    </section>

    <!-- CALL TO ACTION: request a prop -->
    <section class="cta-band about-cta">
      <div class="cta-inner">
        <div>
          <h2 data-i18n="about.ctaTitle"></h2>
          <p data-i18n="about.ctaText"></p>
        </div>
        <a href="custom-props.html" class="btn" data-i18n="about.ctaBtn"></a>
      </div>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => Layout.init());</script>
</body>
</html>
