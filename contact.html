<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu — Contacto</title>
  <meta property="og:image" content="assets/logo_mark.svg">
  <link rel="icon" href="assets/logo_mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <h1 class="contact-title" data-i18n="contact.title"></h1>

    <div class="contact-grid">
      <!-- Left: info -->
      <div class="contact-info">
        <a class="ci-email" id="contact-email" href="#"></a>
        <div class="ci-cols">
          <div>
            <div class="ci-label" data-i18n="contact.findUs"></div>
            <div class="ci-social" id="contact-social"></div>
          </div>
          <div>
            <div class="ci-label" id="contact-address"></div>
            <div class="ci-label" id="contact-phone" style="margin-bottom:0"></div>
          </div>
        </div>
        <p class="contact-note" data-i18n="contact.note"></p>
      </div>

      <!-- Right: form -->
      <form class="contact-form" id="contact-form" method="POST">
        <div class="cf-grid">
          <div class="cf-field">
            <label><span data-i18n="form.name"></span> *</label>
            <input type="text" name="name" required data-i18n-placeholder="form.namePh">
          </div>
          <div class="cf-field">
            <label><span data-i18n="form.phoneLabel"></span></label>
            <input type="tel" name="phone" data-i18n-placeholder="form.phonePh">
          </div>
          <div class="cf-field">
            <label><span data-i18n="form.company"></span></label>
            <input type="text" name="company" data-i18n-placeholder="form.companyPh">
          </div>
          <div class="cf-field">
            <label><span data-i18n="form.emailShort"></span> *</label>
            <input type="email" name="email" required data-i18n-placeholder="form.emailPh">
          </div>
          <div class="cf-field">
            <label><span data-i18n="form.message"></span> *</label>
            <textarea name="message" required data-i18n-placeholder="form.messagePh"></textarea>
          </div>
          <label class="cf-check">
            <input type="checkbox" required>
            <span><span data-i18n="form.privacyPre"></span> <a href="legal.html#privacidad" data-i18n="form.privacyLink"></a> *</span>
          </label>
          <div class="cf-send">
            <button type="submit"><span data-i18n="form.send"></span> <span aria-hidden="true">&#10230;</span></button>
          </div>
          <p class="form-status" id="form-status" role="status" hidden></p>
        </div>
      </form>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await Layout.init();
      const em = document.getElementById("contact-email");
      em.textContent = SITE_CONFIG.email;
      em.href = "mailto:" + SITE_CONFIG.email;
      document.getElementById("contact-phone").textContent = SITE_CONFIG.phoneDisplay;
      document.getElementById("contact-address").textContent = SITE_CONFIG.address;
      const s = SITE_CONFIG.social;
      document.getElementById("contact-social").innerHTML = ["instagram", "youtube", "tiktok", "facebook"]
        .filter(k => s[k])
        .map(k => `<a href="${s[k]}" target="_blank" rel="noopener" aria-label="${k}">${Layout.socialIcons[k] || k}</a>`)
        .join("");
      const form = document.getElementById("contact-form");
      const status = document.getElementById("form-status");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = form.querySelector("button[type=submit]");
        const d = Object.fromEntries(new FormData(form).entries());
        const old = btn.innerHTML; btn.disabled = true; btn.textContent = "…";
        status.hidden = true;
        let r;
        try {
          const res = await fetch(SITE_CONFIG.adminApi, { method: "POST", redirect: "follow",
            body: JSON.stringify({ action: "contact", source: "contacte",
              name: d.name, email: d.email, phone: d.phone, company: d.company, message: d.message }) });
          r = await res.json();
        } catch (err) { r = { ok: false }; }
        if (r && r.ok) {
          form.reset();
          status.textContent = r.message || "Missatge enviat. Gràcies!";
          status.className = "form-status ok";
        } else {
          status.textContent = (r && r.message) || "No s'ha pogut enviar. Escriu-nos per WhatsApp o a " + SITE_CONFIG.email + ".";
          status.className = "form-status err";
        }
        status.hidden = false;
        btn.disabled = false; btn.innerHTML = old;
      });
    });
  </script>
</body>
</html>
