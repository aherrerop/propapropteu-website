<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu — Botiga</title>
  <meta name="description" content="Attrezzo, eines i materials per a teatre, cinema i esdeveniments. Productes de disseny propi, provats al nostre taller.">
  <meta property="og:title" content="Prop a Prop Teu">
  <meta property="og:description" content="Attrezzo, eines i materials per a teatre, cinema i esdeveniments.">
  <meta property="og:image" content="assets/logo_estandar_svg.svg">
  <link rel="icon" href="assets/logo_estandar_svg.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <h1 class="rule-title" data-i18n="catalog.pageTitle"></h1>
    <p class="muted" style="max-width:720px;margin-bottom:26px" data-i18n="catalog.pageIntro"></p>

    <div class="catalog-layout">
      <aside class="filters" id="filters"></aside>
      <section>
        <div class="catalog-toolbar">
          <input type="search" id="search-box" data-i18n-placeholder="catalog.searchPlaceholder">
          <select id="sort-select">
            <option value="featured" data-i18n="catalog.sortFeatured"></option>
            <option value="price-asc" data-i18n="catalog.sortPriceAsc"></option>
            <option value="price-desc" data-i18n="catalog.sortPriceDesc"></option>
            <option value="name" data-i18n="catalog.sortName"></option>
          </select>
          <span class="result-count" id="result-count"></span>
        </div>
        <div class="product-grid" id="product-grid"></div>
      </section>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/catalog.js"></script>
</body>
</html>
