<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu — Attrezzo a mida</title>
  <meta name="description" content="Fabriquem attrezzo a mida per a teatre, cinema, televisió i esdeveniments: impressió 3D, emmotllament, disseny i prototipatge, acabats i fabricació. Demana pressupost.">
  <meta property="og:image" content="assets/logo_estandar_svg.svg">
  <link rel="icon" href="assets/logo_estandar_svg.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <h1 class="rule-title" data-i18n="custom.title"></h1>
    <p class="mission-lead" data-i18n="custom.intro"></p>

    <!-- CAPABILITY SECTIONS — each has room for one or more images.
         Replace the placeholder graphics with real work photos at the
         data-final paths below. -->

    <!-- 3D printing -->
    <section class="feature-section">
      <div class="fs-media">
        <div class="fs-gallery">
          <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/3d-printing-1.jpg"><span class="media-tag">assets/img/custom/3d-printing-1.jpg</span></div>
          <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/3d-printing-2.jpg"><span class="media-tag">assets/img/custom/3d-printing-2.jpg</span></div>
        </div>
      </div>
      <div class="fs-body">
        <span class="fs-eyebrow">01</span>
        <h2 data-i18n="custom.cap3dTitle"></h2>
        <p data-i18n="custom.cap3dText"></p>
      </div>
    </section>

    <!-- Moulding & casting -->
    <section class="feature-section reverse">
      <div class="fs-media">
        <div class="fs-gallery">
          <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/moulding-1.jpg"><span class="media-tag">assets/img/custom/moulding-1.jpg</span></div>
          <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/moulding-2.jpg"><span class="media-tag">assets/img/custom/moulding-2.jpg</span></div>
        </div>
      </div>
      <div class="fs-body">
        <span class="fs-eyebrow">02</span>
        <h2 data-i18n="custom.capMouldTitle"></h2>
        <p data-i18n="custom.capMouldText"></p>
      </div>
    </section>

    <!-- Design & prototyping -->
    <section class="feature-section">
      <div class="fs-media">
        <div class="fs-gallery">
          <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/design-1.jpg"><span class="media-tag">assets/img/custom/design-1.jpg</span></div>
          <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/design-2.jpg"><span class="media-tag">assets/img/custom/design-2.jpg</span></div>
        </div>
      </div>
      <div class="fs-body">
        <span class="fs-eyebrow">03</span>
        <h2 data-i18n="custom.capDesignTitle"></h2>
        <p data-i18n="custom.capDesignText"></p>
      </div>
    </section>

    <!-- Finishing & fabrication -->
    <section class="feature-section reverse">
      <div class="fs-media">
        <div class="fs-gallery">
          <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/finishing-1.jpg"><span class="media-tag">assets/img/custom/finishing-1.jpg</span></div>
          <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/finishing-2.jpg"><span class="media-tag">assets/img/custom/finishing-2.jpg</span></div>
        </div>
      </div>
      <div class="fs-body">
        <span class="fs-eyebrow">04</span>
        <h2 data-i18n="custom.capFinishTitle"></h2>
        <p data-i18n="custom.capFinishText"></p>
      </div>
    </section>

    <!-- More capabilities already on the site -->
    <h2 class="rule-title" data-i18n="custom.moreTitle"></h2>
    <section class="techniques" style="margin-bottom:40px">
      <div class="technique" data-i18n="custom.tech1"></div>
      <div class="technique" data-i18n="custom.tech2"></div>
      <div class="technique" data-i18n="custom.tech3"></div>
      <div class="technique" data-i18n="custom.tech4"></div>
      <div class="technique" data-i18n="custom.tech5"></div>
      <div class="technique" data-i18n="custom.tech6"></div>
      <div class="technique" data-i18n="custom.tech7"></div>
      <div class="technique" data-i18n="custom.tech8"></div>
    </section>

    <!-- QUOTE FORM (unchanged functionality) -->
    <div class="content-block page-narrow" id="quote">
      <h2 data-i18n="custom.quoteTitle"></h2>
      <p class="muted" data-i18n="custom.quoteIntro"></p>
      <form class="std-form" id="quote-form" method="POST" style="margin-top:16px">
        <label><span data-i18n="form.name"></span><input type="text" name="name" required></label>
        <label><span data-i18n="form.email"></span><input type="email" name="email" required></label>
        <label><span data-i18n="form.phone"></span><input type="tel" name="phone"></label>
        <label><span data-i18n="custom.quoteWhat"></span><textarea name="message" required></textarea></label>
        <label><span data-i18n="custom.quoteDeadline"></span><input type="text" name="deadline"></label>
        <button class="btn" type="submit" data-i18n="custom.quoteSend"></button>
      </form>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await Layout.init();
      document.getElementById("quote-form").action = SITE_CONFIG.formEndpoint;
    });
  </script>
</body>
</html>
