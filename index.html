<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu — Attrezzo, eines i materials</title>
  <meta name="description" content="Attrezzo, eines i materials de disseny propi per a cinema, TV, teatre i esdeveniments. Cuelga, ajusta y sigue rodando.">
  <meta property="og:title" content="Prop a Prop Teu">
  <meta property="og:description" content="Attrezzo, eines i materials per a rodatges i escena.">
  <meta property="og:image" content="assets/logo_mark.svg">
  <link rel="icon" href="assets/logo_mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="home">
  <header class="site-header" id="site-header"></header>

  <main class="p-hero-wrap">
    <button class="p-arrow p-prev" aria-label="Anterior" onclick="Hero.prev()">&#171;</button>

    <section class="p-hero">
      <div class="p-watermark" id="hero-wm">ATLAS</div>
      <div class="p-hero-media">
        <img id="hero-img" src="assets/img/products/atlas.svg" alt="" loading="eager">
      </div>
      <div class="p-hero-copy">
        <h1 id="hero-title"></h1>
        <div class="p-hero-desc"><p id="hero-desc"></p></div>
      </div>
      <a class="p-saber" id="hero-link" href="#"><span data-i18n="home.saberMas"></span></a>
    </section>

    <button class="p-arrow p-next" aria-label="Següent" onclick="Hero.next()">&#187;</button>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await Layout.init();
      const data = await Catalog.load();
      const feat = data.products.filter(p => p.featured);
      const slides = feat.length ? feat : data.products.slice(0, 3);
      let i = 0;
      const wm = p => p.codename || (I18N.pick(p.name).split(" ")[0] || "").toUpperCase();
      const render = () => {
        const p = slides[i];
        document.getElementById("hero-wm").textContent = wm(p);
        const img = document.getElementById("hero-img");
        img.src = Catalog.mainImage(p);
        img.alt = I18N.pick(p.name);
        document.getElementById("hero-title").textContent = I18N.pick(p.heroTagline) || I18N.pick(p.name);
        document.getElementById("hero-desc").textContent = I18N.pick(p.heroDesc) || I18N.pick(p.short);
        document.getElementById("hero-link").href = "product.html?id=" + p.id;
      };
      window.Hero = {
        next() { i = (i + 1) % slides.length; render(); },
        prev() { i = (i - 1 + slides.length) % slides.length; render(); }
      };
      render();
      document.addEventListener("langchange", render);
    });
  </script>
</body>
</html>
