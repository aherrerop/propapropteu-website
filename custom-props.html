<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu — Attrezzo a mida</title>
  <meta name="description" content="Fabriquem attrezzo a mida per a teatre, cinema, televisió i esdeveniments: impressió 3D, emmotllament, disseny i prototipatge, acabats i fabricació. Demana pressupost.">
  <meta property="og:image" content="assets/logo_mark.svg">
  <link rel="icon" href="assets/logo_mark.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <h1 data-i18n="custom.title"></h1>
    <p class="mission-lead" data-i18n="custom.intro" style="margin-top:14px"></p>

    <!-- REQUEST A QUOTE — top of page, home-style band -->
    <section class="cta-band bleed" style="margin-bottom:clamp(56px,8vw,110px)">
      <div class="cta-inner">
        <div>
          <h2 data-i18n="home.ctaTitle"></h2>
          <p data-i18n="home.ctaText"></p>
        </div>
        <a href="#quote" class="btn" data-i18n="custom.quoteCtaBtn"></a>
      </div>
    </section>

    <!-- INSTAGRAM-STYLE WORK GALLERY.
         Replace the placeholder squares with real photos at assets/img/custom/work-N.jpg -->
    <div class="section-head">
      <div>
        <span class="eyebrow" data-i18n="custom.workEyebrow"></span>
        <h2 data-i18n="custom.workTitle"></h2>
      </div>
    </div>
    <section class="work-gallery" style="margin-bottom:clamp(56px,8vw,110px)">
      <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/work-1.jpg"><span class="media-tag">work-1.jpg</span></div>
      <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/work-2.jpg"><span class="media-tag">work-2.jpg</span></div>
      <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/work-3.jpg"><span class="media-tag">work-3.jpg</span></div>
      <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/work-4.jpg"><span class="media-tag">work-4.jpg</span></div>
      <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/work-5.jpg"><span class="media-tag">work-5.jpg</span></div>
      <div class="media-box"><img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/custom/work-6.jpg"><span class="media-tag">work-6.jpg</span></div>
    </section>

    <!-- CAPABILITIES — clean numbered list -->
    <div class="section-head">
      <div>
        <span class="eyebrow" data-i18n="custom.capEyebrow"></span>
        <h2 data-i18n="custom.moreTitle"></h2>
      </div>
    </div>
    <section class="capabilities" style="margin-bottom:clamp(56px,8vw,110px)">
      <div class="capability">
        <span class="cap-no">01</span>
        <div><h3 data-i18n="custom.cap3dTitle"></h3><p data-i18n="custom.cap3dText"></p></div>
      </div>
      <div class="capability">
        <span class="cap-no">02</span>
        <div><h3 data-i18n="custom.capMouldTitle"></h3><p data-i18n="custom.capMouldText"></p></div>
      </div>
      <div class="capability">
        <span class="cap-no">03</span>
        <div><h3 data-i18n="custom.capDesignTitle"></h3><p data-i18n="custom.capDesignText"></p></div>
      </div>
      <div class="capability">
        <span class="cap-no">04</span>
        <div><h3 data-i18n="custom.capFinishTitle"></h3><p data-i18n="custom.capFinishText"></p></div>
      </div>
    </section>

    <!-- QUOTE FORM (unchanged functionality) -->
    <div class="page-narrow" id="quote">
      <h2 data-i18n="custom.quoteTitle" style="margin-bottom:10px"></h2>
      <p class="muted" data-i18n="custom.quoteIntro" style="margin-bottom:22px"></p>
      <form class="std-form" id="quote-form" method="POST">
        <label><span data-i18n="form.name"></span><input type="text" name="name" required></label>
        <label><span data-i18n="form.email"></span><input type="email" name="email" required></label>
        <label><span data-i18n="form.phone"></span><input type="tel" name="phone"></label>
        <label><span data-i18n="custom.quoteWhat"></span><textarea name="message" required></textarea></label>
        <label><span data-i18n="custom.quoteDeadline"></span><input type="text" name="deadline"></label>
        <button class="btn" type="submit" data-i18n="custom.quoteSend"></button>
        <p class="form-status" id="quote-status" role="status" hidden></p>
      </form>
    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      await Layout.init();
      const form = document.getElementById("quote-form");
      const status = document.getElementById("quote-status");
      form.addEventListener("submit", async (e) => {
        e.preventDefault();
        const btn = form.querySelector("button[type=submit]");
        const d = Object.fromEntries(new FormData(form).entries());
        const old = btn.textContent; btn.disabled = true; btn.textContent = "…";
        status.hidden = true;
        let r;
        try {
          const res = await fetch(SITE_CONFIG.adminApi, { method: "POST", redirect: "follow",
            body: JSON.stringify({ action: "contact", source: "pressupost",
              name: d.name, email: d.email, phone: d.phone, message: d.message,
              extra: d.deadline ? ("Termini: " + d.deadline) : "" }) });
          r = await res.json();
        } catch (err) { r = { ok: false }; }
        if (r && r.ok) { form.reset(); status.textContent = r.message || "Sol·licitud enviada. Gràcies!"; status.className = "form-status ok"; }
        else { status.textContent = (r && r.message) || ("No s'ha pogut enviar. Escriu-nos a " + SITE_CONFIG.email + "."); status.className = "form-status err"; }
        status.hidden = false;
        btn.disabled = false; btn.textContent = old;
      });
    });
  </script>
</body>
</html>
