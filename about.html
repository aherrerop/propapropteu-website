<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu — Qui som</title>
  <meta property="og:image" content="assets/logo_estandar_svg.svg">
  <link rel="icon" href="assets/logo_estandar_svg.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">
    <h1 class="rule-title" data-i18n="about.title"></h1>

    <!-- VISUAL INTRO: brand on one side, workshop/product image on the other -->
    <section class="about-hero">
      <div class="about-brand">
        <img src="assets/logo_estandar_svg.svg" alt="Prop a Prop Teu" style="height:200px;width:auto;max-width:70%">
      </div>
      <div class="about-media media-box">
        <img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/about/workshop.jpg">
        <span class="media-tag">assets/img/about/workshop.jpg</span>
      </div>
    </section>

    <div class="content-block">
      <h2 data-i18n="about.storyTitle"></h2>
      <p data-i18n="about.story1"></p>
      <p data-i18n="about.story2"></p>
    </div>

    <div class="content-block">
      <h2 data-i18n="about.whatTitle"></h2>
      <ul>
        <li data-i18n="about.what1"></li>
        <li data-i18n="about.what2"></li>
        <li data-i18n="about.what3"></li>
      </ul>
    </div>

    <div class="content-block">
      <h2 data-i18n="about.valuesTitle"></h2>
      <p data-i18n="about.values"></p>
    </div>

    <!-- ==============================================
         TEAM — larger cards with space for real photos.
         Replace the placeholder portraits (assets/img/team/*.jpg)
         and the bracketed placeholder bios in lang/*.json.
         ============================================== -->
    <h2 class="rule-title" data-i18n="team.title" style="margin-top:40px"></h2>
    <p class="muted" style="margin-bottom:24px;max-width:60ch" data-i18n="team.intro"></p>
    <section class="team-grid">
      <article class="team-card">
        <div class="media-box" style="aspect-ratio:4/5">
          <img src="assets/img/placeholder-portrait.svg" alt="" loading="lazy" data-final="assets/img/team/member-1.jpg">
          <span class="media-tag">assets/img/team/member-1.jpg</span>
        </div>
        <h3 data-i18n="team.member1name"></h3>
        <div class="role" data-i18n="team.member1role"></div>
        <p data-i18n="team.member1bio"></p>
      </article>
      <article class="team-card">
        <div class="media-box" style="aspect-ratio:4/5">
          <img src="assets/img/placeholder-portrait.svg" alt="" loading="lazy" data-final="assets/img/team/member-2.jpg">
          <span class="media-tag">assets/img/team/member-2.jpg</span>
        </div>
        <h3 data-i18n="team.member2name"></h3>
        <div class="role" data-i18n="team.member2role"></div>
        <p data-i18n="team.member2bio"></p>
      </article>
      <article class="team-card">
        <div class="media-box" style="aspect-ratio:4/5">
          <img src="assets/img/placeholder-portrait.svg" alt="" loading="lazy" data-final="assets/img/team/member-3.jpg">
          <span class="media-tag">assets/img/team/member-3.jpg</span>
        </div>
        <h3 data-i18n="team.member3name"></h3>
        <div class="role" data-i18n="team.member3role"></div>
        <p data-i18n="team.member3bio"></p>
      </article>
    </section>

    <!-- FAQ section (kept; full list lives on the FAQ page) -->
    <section class="cta-band" style="margin-top:12px">
      <div>
        <h2 data-i18n="about.faqTitle"></h2>
        <p data-i18n="about.faqText"></p>
      </div>
      <a href="faq.html" class="btn" data-i18n="about.faqBtn"></a>
    </section>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => Layout.init());</script>
</body>
</html>
