<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prop a Prop Teu — Attrezzo, eines i materials</title>
  <meta name="description" content="Fem la feina més fàcil als equips de rodatge: attrezzistes, direcció d'art, prop makers. Attrezzo de disseny propi, fabricació a mida i packs de producció.">
  <meta property="og:title" content="Prop a Prop Teu">
  <meta property="og:description" content="Fem possible qualsevol escena: attrezzo, fabricació a mida i packs de producció per a cinema, TV, teatre i esdeveniments.">
  <meta property="og:image" content="assets/logo_estandar_svg.svg">
  <link rel="icon" href="assets/logo_estandar_svg.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header" id="site-header"></header>

  <main class="container">

    <!-- HERO — mission first -->
    <section class="hero home-hero">
      <h1 data-i18n="home.heroTitle"></h1>
      <p data-i18n="home.heroSubtitle"></p>
      <div class="hero-cta-row">
        <a href="shop.html" class="btn" data-i18n="home.heroCtaShop"></a>
        <a href="custom-props.html" class="btn btn-outline" data-i18n="home.heroCtaCustom"></a>
      </div>
    </section>

    <!-- PROMINENT CTA — moved high up -->
    <section class="cta-band cta-prominent">
      <div>
        <h2 data-i18n="home.ctaTitle"></h2>
        <p data-i18n="home.ctaText"></p>
      </div>
      <a href="contact.html" class="btn" data-i18n="home.ctaBtn"></a>
    </section>

    <!-- MISSION — what we're for -->
    <h2 class="rule-title" data-i18n="home.missionTitle"></h2>
    <p class="mission-lead" data-i18n="home.missionLead"></p>
    <section class="qualities" style="margin-bottom:44px">
      <div class="quality">
        <span class="quality-mark quality-mark-1">01</span>
        <h3 data-i18n="home.m1title"></h3>
        <p data-i18n="home.m1text"></p>
      </div>
      <div class="quality">
        <span class="quality-mark quality-mark-2">02</span>
        <h3 data-i18n="home.m2title"></h3>
        <p data-i18n="home.m2text"></p>
      </div>
      <div class="quality">
        <span class="quality-mark quality-mark-3">03</span>
        <h3 data-i18n="home.m3title"></h3>
        <p data-i18n="home.m3text"></p>
      </div>
    </section>

    <!-- FULL-WIDTH SECTIONS -->
    <h2 class="rule-title" data-i18n="home.exploreTitle"></h2>
    <!-- Replace the placeholder graphics with real photos at the data-final paths. -->

    <!-- Shop -->
    <section class="feature-section">
      <div class="fs-media">
        <img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/home/shop.jpg">
        <span class="media-tag">assets/img/home/shop.jpg</span>
      </div>
      <div class="fs-body">
        <span class="fs-eyebrow" data-i18n="nav.catalog"></span>
        <h2 data-i18n="home.showTitle"></h2>
        <p data-i18n="home.showText"></p>
        <a href="shop.html" class="btn" data-i18n="home.showLink"></a>
      </div>
    </section>

    <!-- Custom props -->
    <section class="feature-section reverse">
      <div class="fs-media">
        <img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/home/custom-props.jpg">
        <span class="media-tag">assets/img/home/custom-props.jpg</span>
      </div>
      <div class="fs-body">
        <span class="fs-eyebrow" data-i18n="nav.custom"></span>
        <h2 data-i18n="home.customTitle"></h2>
        <p data-i18n="home.customText"></p>
        <a href="custom-props.html" class="btn" data-i18n="home.customLink"></a>
      </div>
    </section>

    <!-- Production packs -->
    <section class="feature-section">
      <div class="fs-media">
        <img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/home/production-packs.jpg">
        <span class="media-tag">assets/img/home/production-packs.jpg</span>
      </div>
      <div class="fs-body">
        <span class="fs-eyebrow" data-i18n="nav.packs"></span>
        <h2 data-i18n="home.packsTitle"></h2>
        <p data-i18n="home.packsText"></p>
        <a href="packs.html" class="btn" data-i18n="home.packsLink"></a>
      </div>
    </section>

    <!-- About us -->
    <section class="feature-section reverse">
      <div class="fs-media">
        <img src="assets/img/placeholder-landscape.svg" alt="" loading="lazy" data-final="assets/img/home/about.jpg">
        <span class="media-tag">assets/img/home/about.jpg</span>
      </div>
      <div class="fs-body">
        <span class="fs-eyebrow" data-i18n="nav.about"></span>
        <h2 data-i18n="home.aboutTitle"></h2>
        <p data-i18n="home.aboutText"></p>
        <a href="about.html" class="btn" data-i18n="home.aboutLink"></a>
      </div>
    </section>

  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script src="js/config.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/layout.js"></script>
  <script>document.addEventListener("DOMContentLoaded", () => Layout.init());</script>
</body>
</html>
